  <div class="body">
    <p>各有关单位：现将2026年度科研合作项目申报事项通告如下。</p>
    <p>一、申报时间为2026年6月1日至2026年7月15日，逾期不再受理。项目代号为〔KX-2026-01〕，请务必在申报表中保持一致。</p>
    <p>三、每个申报单位最多申报两个项目；超过限额的申报材料不予受理，且不另行通知。</p>
    <p>五、本通告未尽事宜，由科研管理处负责解释。</p>
